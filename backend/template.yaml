AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Connect3 Application deployed on AWS Lambda

Globals:
  Function:
    Timeout: 30

Resources:
  FastAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.main.handler
      Runtime: python3.13
      Events:
        Api:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY